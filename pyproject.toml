[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "elbot"
version = "0.1.0"
description = "A modular Discord bot using Nextcord and OpenAI."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Elbot Team"}]
license = {text = "MIT"}
dependencies = [
    "nextcord>=2.6,<3",
    "setuptools<81",  # Nextcord 2.6 imports pkg_resources at runtime.
    "PyNaCl>=1.5.0",
    "openai",
    "textblob",
    "python-dotenv>=1.0.1",
    "platformdirs>=4.2",
    "psutil",
    "mafic>=2.11.0",
    "yt-dlp[default]>=2026.7.4",
    "Flask",
    "icalendar",
    "aiohttp",
    "cachetools",
    "pywin32; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = [
    "pytest",
    "nextcord",
    "aiohttp[speedups]",
    "pytest-asyncio",
]

[project.scripts]
elbot = "elbot.main:main"
elbot-portal = "elbot.portal:main"
elbot-install-service = "elbot.service_install:main"
elbotctl = "elbot.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
elbot = [
    "templates/*.html",
    "static/*",
    "live/transport/*.mjs",
    "live/transport/package.json",
    "live/transport/pnpm-lock.yaml",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["elbot*"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]



